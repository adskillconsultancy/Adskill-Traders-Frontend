<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <!-- Modern Gradient for Trader Shield / Crest -->
    <linearGradient id="shieldGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a3266"/>
      <stop offset="100%" stop-color="#001838"/>
    </linearGradient>

    <!-- Luxury Gold Gradient for Arrows & Accents -->
    <linearGradient id="goldGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc95c"/>
      <stop offset="50%" stop-color="#f5b026"/>
      <stop offset="100%" stop-color="#e8a020"/>
    </linearGradient>

    <filter id="badgeShadowWhite" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- ================= ICON / EMBLEM ================= -->
  <g transform="translate(10, 10)" filter="url(#badgeShadowWhite)">
    <!-- Shield Container -->
    <path d="M50 0 L92 18 C92 62 68 88 50 100 C32 88 8 62 8 18 Z" 
          fill="url(#shieldGradWhite)" 
          stroke="url(#goldGradWhite)" 
          stroke-width="2.5" />

    <!-- Global Latitude / Longitude Trading Rings inside Shield -->
    <ellipse cx="50" cy="50" rx="30" ry="30" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" />
    <ellipse cx="50" cy="50" rx="14" ry="30" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" />
    <line x1="20" y1="50" x2="80" y2="50" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />

    <!-- Dynamic Interlocking Trading Exchange Arrows (A & S / Trade Flow) -->
    <!-- Upward Export/Import Trade Arrow (Gold) -->
    <path d="M38 72 L38 38 L30 46 L38 24 L54 42 L46 42 L46 72 Z" fill="url(#goldGradWhite)"/>
    
    <!-- Opposite Forward Exchange Arrow (White / Platinum) -->
    <path d="M62 28 L62 62 L70 54 L62 76 L46 58 L54 58 L54 28 Z" fill="#ffffff" fill-opacity="0.95"/>

    <!-- Center Precision Node (Trade Nexus) -->
    <circle cx="50" cy="50" r="4.5" fill="#f5b026" stroke="#001838" stroke-width="1.5"/>
  </g>

  <!-- ================= TYPOGRAPHY ================= -->
  <!-- Main Brand Name: AdSkill (Crisp White for Dark Backing) -->
  <text x="126" y="58" 
        font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="46" 
        font-weight="900" 
        letter-spacing="-0.5px"
        fill="#ffffff">
    AdSkill
  </text>

  <!-- Unique Premium Subtitle: TRADERS -->
  <g transform="translate(128, 68)">
    <!-- Gold accent badge backing -->
    <rect x="0" y="4" width="176" height="26" rx="6" fill="#f5b026" fill-opacity="0.2" />
    <rect x="0" y="4" width="4" height="26" rx="2" fill="url(#goldGradWhite)" />
    
    <!-- Subtitle Text -->
    <text x="14" y="23" 
          font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="16" 
          font-weight="800" 
          letter-spacing="5px" 
          fill="#ffc95c">
      TRADERS
    </text>

    <!-- Global Trade Micro Indicator -->
    <circle cx="158" cy="17" r="3" fill="#ffffff" />
    <circle cx="158" cy="17" r="6" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
  </g>
</svg>
